<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Login Admin</title>
  <link rel="stylesheet" href="/styles/blog.css" />
  <link rel="icon" href="/images/favicon.png" type="image/png" />
</head>
<body class="login-page">

    <h2>Admin Login</h2>

  <script src="/scripts/login.js"></script>
</body>
</html>
