<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Admin panel</title>
  <link rel="stylesheet" href="/styles/blog.css" />
</head>
<body>
  <header>
    <h1><a href="/blog/index.html" style="color: inherit; text-decoration: none;">BBlog Admin</a></h1>
    <button class="login-button" id="logoutBtn">Logout</button>
  </header>

  <main>
    <section id="create-post-section">
      <h2>Create new post</h2>
      <form id="postForm">
        <input type="text" id="postTitle" placeholder="Título" required />
        <input type="text" id="postCategory" placeholder="Categoria" required />
        <textarea id="postMarkdown" rows="10" placeholder="Digite o texto em Markdown aqui..." style="width: 100%; margin-top: 10px;"></textarea>
        <button type="submit" style="margin-top: 10px;">Create</button>
      </form>
    </section>

    <section id="posts-list-section" style="margin-top:40px;">
      <h2>Existing posts</h2>
      <div id="postsList"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/scripts/admin.js"></script>
</body>
</html>
